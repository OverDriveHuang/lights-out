name: Publish Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Verify fixed release asset
        shell: bash
        run: |
          set -euo pipefail
          expected="0665551b070a0a4fb0f26a513f6cfc36aad0fb9d1eb8854dd570a722fc31ff6b"
          actual="$(sha256sum .github/release-assets/LightsOut-v2.0.0-macOS-arm64.zip | awk '{print $1}')"
          test "$actual" = "$expected"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            .github/release-assets/LightsOut-v2.0.0-macOS-arm64.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "LightsOut 2.0.0 — Display Layouts & Safety Recovery" \
            --notes-file .github/release-assets/RELEASE_NOTES-v2.0.0.md \
            --verify-tag
